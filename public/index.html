<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovation Tracking System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="app-header">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
            <h1>InnovationTrack</h1>
        </div>
        <nav>
            <button class="nav-btn active" data-target="dashboard">Dashboard</button>
            <button class="nav-btn" data-target="projects">Projects</button>
            <button class="nav-btn" data-target="audit">Audit Log</button>
        </nav>
    </header>

    <main class="container">
        <!-- Dashboard View -->
        <section id="dashboard" class="view active">
            <h2>Departmental Impact Summary</h2>
            <div class="stats-grid" id="analytics-container">
                <!-- Analytics Cards injected here -->
            </div>
        </section>

        <!-- Projects View -->
        <section id="projects" class="view">
            <div class="header-action">
                <h2>Innovation Projects</h2>
                <button class="btn primary" onclick="app.showNewProjectModal()">+ New Project</button>
            </div>
            <div class="projects-list" id="projects-container">
                <!-- Project Cards injected here -->
            </div>
        </section>

        <!-- Audit Log View -->
        <section id="audit" class="view">
            <h2>Audit Trail</h2>
            <div class="audit-timeline" id="audit-container">
                <!-- Audit Items injected here -->
            </div>
        </section>
    </main>

    <!-- Modals -->
    <div class="modal-overlay" id="modal-overlay" style="display: none;">
        <div class="modal" id="modal-content">
            <!-- Modal Content Injected Here -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
